name: C++ CI

on:
  push:
  pull_request:

jobs:
  exercise-1-lets-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile hello.cc
        run: g++ -std=c++17 -Wall -Wextra -Werror hello.cc -o hello
      - name: Check program output
        run: |
          output="$(./hello)"
          printf '%s\n' "$output"
          [[ "$output" == *ello* ]]

  exercise-2-input-and-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile sum.cc
        run: g++ -std=c++17 -Wall -Wextra -Werror sum.cc -o sum
      - name: Generate and validate row sums
        run: |
          ./sum
          awk '{ print $1 + $2 }' data.txt > expected.txt
          diff -u expected.txt sums.txt